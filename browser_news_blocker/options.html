<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>News limiter — options</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>Additional news websites</h1>
      <p>Enter one domain per line, for example <code>news.ycombinator.com</code>.</p>
      <textarea id="domains" spellcheck="false" placeholder="example.com"></textarea>
      <button id="save">Save</button>
      <p id="status" role="status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
